[project]
name = "tcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "repiece", email = "340508578@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cartopy>=0.26.0",
    "catboost>=1.2.10",
    "cdsapi>=0.7.7",
    "cdsswarm>=0.3.0",
    "cfgrib>=0.9.15.1",
    "earthkit>=0.4.3",
    "earthkit-data>=1.2.3",
    "geoviews>=1.15.1",
    "ipykernel>=7.3.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "metpy>=1.7.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pygrib>=2.1.8",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.52.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "xarray>=2026.7.0",
    "xgboost>=3.4.1",
]

[project.scripts]
tcc = "tcc:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
