# ERA5 批量下载配置
#
# 用法：
#   uv run python -m tcc.download_workers --config configs/download.yaml --dry-run
#   uv run python -m tcc.download_workers --config configs/download.yaml
#
# area 格式: [北, 西, 南, 东]  (N, W, S, E)

# 数据落盘根目录。null = 优先读环境变量 TCC_DATA_DIR，否则用仓库下的 ./data
data_dir: null

# CDS 凭据文件路径。
# 建议写绝对路径（如 /opt/tcc/.cdsapirc），这样无论是手动跑还是 systemd 跑，
# 都不依赖 HOME，也不会踩到 "Missing/incomplete configuration file: /root/.cdsapirc"。
# 留 null = 用 $CDSAPI_RC，再退回 ~/.cdsapirc
cdsapirc: null

# 并发数、重试次数都由脚本自动决定，不需要在这里配：
#   * 并发起步 = 2 × 分组数（CDS 的排队配额按数据集算，每个数据集留 2 个并发），
#     撞到配额自动降 1，顺利就慢慢加回去；
#   * 单个任务内部重试固定 2 次（重试太多只会反复撞配额）。

# 外层轮次：一轮跑完后，对仍失败/被中断的任务再跑一轮，直到全部成功。
# 每次重跑都会自动 skip 已完成的文件、并复用 CDS 上已提交的 job（不重新排队）。
max_rounds: 60

# 年份区间（含两端）
years: [1981, 2025]

# 每个请求包含几年。**这个值受 CDS 硬上限约束**（实测数据）：
#     12 年 × 1 月 = 372 天 → 通过
#     15 年 × 1 月 = 465 天 → "Your request is too large"
#     20 年 × 1 月 = 620 天 → 拒绝
#   frequency（1/3/6_hourly）不影响该上限，纯粹按"天数"算。
# 取 12 可把请求数压到 4 块 × 4 月 × 3 组 = 48 个（year_batch=5 时是 108 个）。
# 注意月份不合并：6 月没有 31 日，而一个请求只能给一份 day 列表。
year_batch: 12

# 月份（5—8 月暖季）
months: [5, 6, 7, 8]

# 统一时区：让"日"按北京时间切分，与 Tmax 的定义保持一致
time_zone: "utc+08:00"

# 亚日采样频率。1_hourly 保持精度（日最高温误差约 0.1℃）；
# 3_hourly 省 2/3 流量，但日最高温误差可达约 1℃，而本项目 σ(d) 仅 1.2—1.5℃，不要降。
frequency: "1_hourly"

# 下载分组。每个分组 = 一个 CDS 数据集 + 一套检索参数
groups:

  # ① 目标变量：长江中下游区域日最高气温
  #
  # source: openmeteo —— 走 Open-Meteo Archive API（ERA5-Land 日最高温）。
  # 为什么不走 CDS：CDS 2026 年长期过载（全局排队 8000+、单账号还有排队配额），
  #   实测一晚只落盘 2 个文件；而 ARCO-ERA5 的 Zarr 每 chunk 是全球一整层，
  #   本区域只占 0.12%，逐小时取需 305 GB。Open-Meteo 免认证、免排队，
  #   且提供的是同一产品（ERA5-Land daily temperature_2m_max）。
  # 采样点：按 point_spacing 在区域内取规则网格，下游做 cos(lat) 面积加权平均。
  tmax:
    source: openmeteo
    variable: 2m_temperature
    point_spacing: 0.5              # 13×25 = 325 个点（API 的 URL 长度限制下最稳）
    area: [34, 110, 28, 122]        # 只下研究区

  # ② 大尺度单层要素：SST + 海平面气压（需要大域才能看到副高与太平洋海温）
  sst_mslp:
    dataset: derived-era5-single-levels-daily-statistics
    statistic: daily_mean
    variables: [sea_surface_temperature, mean_sea_level_pressure]
    # 原为 [55, 70, 15, 140]：140°E 把西太暖池和副高核心区切掉了 —— 等于下了几十 GB
    # 却缺了最关键的一块（副高中心在 130—150°E、暖池核心在 120—160°E）。
    # 现往东扩到 160°E、南到赤道。area 不计入 cost limit，扩区域不要钱（格点数仅 +16%）。
    area: [50, 95, 0, 160]
    # CDS 的 cost = 天数 × 变量数 × 层数。单变量实测 372 天可过、465 天被拒，
    # 这里 2 个变量 → 每年上限约 186 天 → 取 6 年/请求（186 天）。
    year_batch: 6

  # ③ 环流要素：500/850 hPa 位势高度与风场
  circ:
    dataset: derived-era5-pressure-levels-daily-statistics
    statistic: daily_mean
    variables: [geopotential, u_component_of_wind, v_component_of_wind]
    pressure_level: ['500', '850']
    # 同 ②：往东扩到 160°E 才看得到副高主体；南到赤道才有热带对流（延伸期可预报性的来源）。
    area: [55, 95, 0, 160]
    # 3 变量 × 2 层 = 6 个字段 → 每年上限约 62 天 → 取 2 年/请求（62 天）
    year_batch: 2

# 说明：
#  - 三个数据集都是"服务端算好的日统计量"，下载量比逐小时小 24 倍，
#    且不需要本地再聚合，同时由服务端保证 time_zone 口径一致。
#  - 若确实需要逐小时原始数据，把 dataset 换成 reanalysis-era5-* 系列，
#    并补上 time 字段；但体积会回到百 GB 量级。
#  - 体积估算（按实测压缩率：ERA5-Land 日最高 0.645 字节/值；
#    ERA5 日场 0.645—2.0，取中值 1.2）：
#        本配置 约 3.0 GB   （tmax 0.03 / sst_mslp 0.70 / circ 2.30）
#        逐小时版 约 99 GB  （circ 73 / sst_mslp 24 / tmax 1.0）
#  - 可选精简，**等因子筛选结果出来再决定，现在别删**：
#        * mean_sea_level_pressure 与 500 hPa 位势高度高度共线 → 约省 0.35 GB；
#        * u/v 只留 850 hPa、500 hPa 只留位势，6 个字段降到 3 个 → circ 组省一半（约 1.15 GB）。
#    这两刀合计只值 1.5 GB（体积已不是瓶颈），但删错变量是不可逆的科学损失 ——
#    先跑相关/互信息/VIF，再回来改这里。
